# =============================================================================
# .gitlab-ci.yml — Personal Finance Ledger App
# GitLab CI/CD equivalent of .github/workflows/ci.yml + deploy.yml + staging-ci.yml
#
# Dual-CI setup: this file coexists with .github/workflows/ so the app runs
# on EITHER GitHub Actions (when hosted on GitHub) or GitLab CI (when hosted
# on GitLab) without any changes to the pipeline logic.
#
# GHCR image base is kept identical to GitHub Actions so both CI systems
# push/pull from the same registry paths:
#   ghcr.io/jplipio77/personalfinanceledgerapp/backend
#   ghcr.io/jplipio77/personalfinanceledgerapp/frontend
#
# Mirrors:                          GitHub Actions equivalent:
#   unit-tests        ──────────    ci.yml / unit-tests
#   component-tests   ──────────    ci.yml / component-tests
#   frontend-tests    ──────────    ci.yml / frontend-tests
#   docker-build-check ─────────    ci.yml / docker-build-check
#   build-push        ──────────    deploy.yml / build-push
#   slim-images       ──────────    deploy.yml / slim-images  (optional)
#   integration-test  ──────────    deploy.yml / dispatch-tests → ledger-app-tests
#   staging-build     ──────────    staging-ci.yml / build-and-package
#   staging-deploy    ──────────    staging-ci.yml / staging-deploy
#   staging-tests     ──────────    staging-ci.yml / staging-tests
#   staging-security  ──────────    staging-ci.yml / security-scan
#
# Required CI/CD Variables (Settings → CI/CD → Variables):
#   CR_PAT            — GitHub Classic PAT with write:packages + read:packages
#                       (needed to push to GHCR from GitLab runners)
#   JWT_SECRET        — App JWT secret, passed to backend container
#   CODECOV_TOKEN     — (optional) Codecov upload token
#
# For staging deploy jobs (optional, requires staging server):
#   STAGING_HOST      — Staging server IP (scope: staging environment, File type)
#   STAGING_USER      — SSH username     (scope: staging environment)
#   STAGING_SSH_KEY   — Private SSH key  (scope: staging environment, File type)
#   GHCR_READ_TOKEN   — PAT read:packages (scope: staging environment)
#   STAGING_URL       — https://your-staging-url.com (scope: staging environment)
# =============================================================================

# ── Workflow-level trigger rules ─────────────────────────────────────────────
# Mirrors GitHub Actions `on:` triggers from ci.yml and deploy.yml combined.
workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "push"'               # all branches (mirrors ci.yml push: branches: ["**"])
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'  # PRs (mirrors pull_request to main)
    - if: '$CI_PIPELINE_SOURCE == "web"'                # manual run from UI (mirrors workflow_dispatch)
    - if: '$CI_PIPELINE_SOURCE == "api"'                # API-triggered runs
    - if: '$CI_PIPELINE_SOURCE == "trigger"'            # cross-project pipeline triggers

stages:
  - test            # unit-tests, component-tests, frontend-tests (parallel) — mirrors ci.yml
  - validate        # docker-build-check — mirrors ci.yml docker-build-check
  - build           # build-push — mirrors deploy.yml build-push (main only)
  - integration     # integration-test — replaces deploy.yml dispatch-tests + ledger-app-tests
  - staging-build   # staging-build — mirrors staging-ci.yml / build-and-package
  - staging-deploy  # staging-deploy — mirrors staging-ci.yml / staging-deploy
  - staging-test    # staging-tests + staging-security (parallel) — mirrors staging-ci.yml

# ── Shared GHCR image base (matches GitHub Actions deploy.yml exactly) ───────
# Both CI systems push/pull from the same registry paths.
# GitHub Actions uses: ghcr.io/${{ steps.sha.outputs.repo }}/backend
# which resolves to:   ghcr.io/jplipio77/personalfinanceledgerapp/backend
variables:
  GHCR_IMAGE_BASE: "ghcr.io/jplipio77/personalfinanceledgerapp"
  REGISTRY:        "ghcr.io"


# =============================================================================
# STAGE 1 — TEST
# Mirrors ci.yml: unit-tests, component-tests, frontend-tests jobs (parallel).
# Runs on ALL branches and MRs, same as GitHub Actions ci.yml.
# =============================================================================

# ── unit-tests ────────────────────────────────────────────────────────────────
# Mirrors ci.yml / unit-tests job
unit-tests:
  stage: test
  image: node:20
  before_script:
    - cd backend
    - npm ci
  variables:
    CI:              "true"
    JWT_SECRET:      "test-secret"
    MONGOMS_VERSION: "7.0.14"
  script:
    - npm run test:unit -- --json --outputFile=../unit-results.json
    # Inline summary — equivalent to ci.yml actions/github-script job summary
    - |
      node -e "
      const fs = require('fs');
      let d;
      try { d = JSON.parse(fs.readFileSync('unit-results.json', 'utf8')); }
      catch { console.log('Unit Tests — results unavailable'); process.exit(0); }
      const failed = d.numFailedTests || 0;
      const passed = d.numPassedTests || 0;
      const total  = d.numTotalTests  || 0;
      const pct    = total > 0 ? Math.round((passed / total) * 100) : 0;
      console.log('');
      console.log('=== Unit Tests — ' + (failed === 0 ? 'PASSED' : 'FAILED') + ' ===');
      console.log('Total: ' + total + ' | Passed: ' + passed + ' | Failed: ' + failed + ' | Pass Rate: ' + pct + '%');
      (d.testResults || []).forEach(suite => {
        (suite.testResults || []).forEach(t => {
          const icon = t.status === 'passed' ? 'PASS' : t.status === 'failed' ? 'FAIL' : 'SKIP';
          console.log('  [' + icon + '] ' + t.fullName);
        });
      });
      process.exit(failed > 0 ? 1 : 0);
      " 2>/dev/null
  artifacts:
    name:   "unit-results-${CI_COMMIT_SHORT_SHA}"
    paths:  [unit-results.json]
    expire_in: 30 days
    when:   always

# ── component-tests ───────────────────────────────────────────────────────────
# Mirrors ci.yml / component-tests job (backend integration tests)
component-tests:
  stage: test
  image: node:20
  before_script:
    - cd backend
    - npm ci
  variables:
    CI:              "true"
    JWT_SECRET:      "test-secret"
    MONGOMS_VERSION: "7.0.14"
  script:
    - npm run test:component -- --json --outputFile=../component-results.json
    - |
      node -e "
      const fs = require('fs');
      let d;
      try { d = JSON.parse(fs.readFileSync('component-results.json', 'utf8')); }
      catch { console.log('Component Tests — results unavailable'); process.exit(0); }
      const failed = d.numFailedTests || 0;
      const passed = d.numPassedTests || 0;
      const total  = d.numTotalTests  || 0;
      const pct    = total > 0 ? Math.round((passed / total) * 100) : 0;
      console.log('');
      console.log('=== Component Tests — ' + (failed === 0 ? 'PASSED' : 'FAILED') + ' ===');
      console.log('Total: ' + total + ' | Passed: ' + passed + ' | Failed: ' + failed + ' | Pass Rate: ' + pct + '%');
      (d.testResults || []).forEach(suite => {
        (suite.testResults || []).forEach(t => {
          const icon = t.status === 'passed' ? 'PASS' : t.status === 'failed' ? 'FAIL' : 'SKIP';
          console.log('  [' + icon + '] ' + t.fullName);
        });
      });
      process.exit(failed > 0 ? 1 : 0);
      " 2>/dev/null
  artifacts:
    name:   "component-results-${CI_COMMIT_SHORT_SHA}"
    paths:  [component-results.json]
    expire_in: 30 days
    when:   always

# ── frontend-tests ────────────────────────────────────────────────────────────
# Mirrors ci.yml / frontend-tests job (lint + jest)
frontend-tests:
  stage: test
  image: node:20
  before_script:
    - cd frontend
    - npm ci
  variables:
    CI: "true"
  script:
    - npm run lint
    - npm run test -- --json --outputFile=../frontend-results.json
    - |
      node -e "
      const fs = require('fs');
      let d;
      try { d = JSON.parse(fs.readFileSync('frontend-results.json', 'utf8')); }
      catch { console.log('Frontend Tests — results unavailable or no tests (passWithNoTests)'); process.exit(0); }
      const failed = d.numFailedTests || 0;
      const passed = d.numPassedTests || 0;
      const total  = d.numTotalTests  || 0;
      console.log('=== Frontend Tests — ' + (failed === 0 ? 'PASSED' : 'FAILED') + ' ===');
      console.log('Total: ' + total + ' | Passed: ' + passed + ' | Failed: ' + failed);
      process.exit(failed > 0 ? 1 : 0);
      " 2>/dev/null
  artifacts:
    name:   "frontend-results-${CI_COMMIT_SHORT_SHA}"
    paths:  [frontend-results.json]
    expire_in: 30 days
    when:   always


# =============================================================================
# STAGE 2 — VALIDATE (Docker build smoke test)
# Mirrors ci.yml / docker-build-check job.
# Builds dev-target images to catch Dockerfile regressions early.
# Runs on all branches; does NOT push (no registry credentials needed).
# =============================================================================
docker-build-check:
  stage: validate
  image: docker:24
  services:
    - docker:24-dind
  variables:
    DOCKER_TLS_CERTDIR: "/certs"
    DOCKER_BUILDKIT:    "1"
  needs:
    - job: unit-tests
      artifacts: false
    - job: component-tests
      artifacts: false
    - job: frontend-tests
      artifacts: false
  script:
    # Create minimal .env files so Docker build doesn't error on missing env_file
    - cp backend/.env.example backend/.env  2>/dev/null || echo "NODE_ENV=test" > backend/.env
    - cp frontend/.env.example frontend/.env 2>/dev/null || echo "VITE_API_URL=http://localhost:5000" > frontend/.env
    # Build dev targets — same as ci.yml docker-build-check
    - docker build --target dev -t pfl-backend-dev-check  ./backend
    - docker build --target dev -t pfl-frontend-dev-check ./frontend
    - echo "Docker build smoke test passed."


# =============================================================================
# STAGE 3 — BUILD (main push only)
# Mirrors deploy.yml / build-push job.
# Builds prod-target images, pushes to GHCR with short SHA + latest tags.
# Uses the SAME image names as GitHub Actions so both CI systems share images.
# =============================================================================
build-push:
  stage: build
  image: docker:24
  services:
    - docker:24-dind
  variables:
    DOCKER_TLS_CERTDIR: "/certs"
    DOCKER_BUILDKIT:    "1"
  needs:
    - job: docker-build-check
      artifacts: false
  rules:
    - if: '$CI_COMMIT_BRANCH == "main" && $CI_PIPELINE_SOURCE == "push"'
  script:
    # Login to GHCR — CR_PAT must be a GitHub PAT with write:packages scope
    - echo "${CR_PAT}" | docker login ghcr.io -u jplipio77 --password-stdin

    # Short SHA tag matches GitHub Actions: git rev-parse --short HEAD
    - SHORT_SHA="${CI_COMMIT_SHORT_SHA}"
    - echo "IMAGE_TAG=${SHORT_SHA}" >> build.env

    # ── Backend (prod target) ─────────────────────────────────────────────────
    - |
      docker build \
        --target prod \
        --cache-from "${GHCR_IMAGE_BASE}/backend:latest" \
        --build-arg BUILDKIT_INLINE_CACHE=1 \
        -t "${GHCR_IMAGE_BASE}/backend:${SHORT_SHA}" \
        -t "${GHCR_IMAGE_BASE}/backend:latest" \
        ./backend

    # ── Frontend (prod target — nginx) ────────────────────────────────────────
    - |
      docker build \
        --target prod \
        --cache-from "${GHCR_IMAGE_BASE}/frontend:latest" \
        --build-arg BUILDKIT_INLINE_CACHE=1 \
        -t "${GHCR_IMAGE_BASE}/frontend:${SHORT_SHA}" \
        -t "${GHCR_IMAGE_BASE}/frontend:latest" \
        ./frontend

    # Push all tags
    - docker push "${GHCR_IMAGE_BASE}/backend:${SHORT_SHA}"
    - docker push "${GHCR_IMAGE_BASE}/backend:latest"
    - docker push "${GHCR_IMAGE_BASE}/frontend:${SHORT_SHA}"
    - docker push "${GHCR_IMAGE_BASE}/frontend:latest"

    - 'echo "Images pushed: ${GHCR_IMAGE_BASE}/backend:${SHORT_SHA}"'

  # dotenv artifact passes IMAGE_TAG to integration-test
  artifacts:
    reports:
      dotenv: build.env
    expire_in: 1 day


# =============================================================================
# STAGE 4 — INTEGRATION TEST (main push only)
# Replaces deploy.yml / dispatch-tests + ledger-app-tests pipeline.
# Tests live here in-repo (tests/postman/, tests/playwright/, tests/k6/)
# so no cross-repo trigger is needed.
#
# Pulls the images just built by build-push, spins them up via docker compose,
# and runs the full 4-stage test suite against localhost.
#
# Test script paths and env vars match the existing test files exactly:
#   tests/postman/auth-flows.collection.json  — Newman (baseUrl localhost:5000/api)
#   tests/playwright/playwright.config.js     — Playwright (APP_URL localhost:80)
#   tests/k6/auth-load.js                     — k6 (STAGING_URL localhost:5000)
# =============================================================================
integration-test:
  stage: integration
  image: node:20
  services:
    - name: docker:24-dind
      alias: docker
  variables:
    DOCKER_TLS_CERTDIR: "/certs"
    DOCKER_HOST:        "tcp://docker:2376"
    DOCKER_TLS_VERIFY:  "1"
    DOCKER_CERT_PATH:   "/certs/client"
  needs:
    - job: build-push
      artifacts: true   # pulls IMAGE_TAG from build.env dotenv artifact
  rules:
    - if: '$CI_COMMIT_BRANCH == "main" && $CI_PIPELINE_SOURCE == "push"'
  before_script:
    - apt-get update -qq && apt-get install -y -qq ca-certificates curl gnupg lsb-release
    - install -m 0755 -d /etc/apt/keyrings
    - curl -fsSL https://download.docker.com/linux/debian/gpg | gpg --dearmor -o /etc/apt/keyrings/docker.gpg
    - chmod a+r /etc/apt/keyrings/docker.gpg
    - echo "deb [arch=$(dpkg --print-architecture) signed-by=/etc/apt/keyrings/docker.gpg] https://download.docker.com/linux/debian $(lsb_release -cs) stable" | tee /etc/apt/sources.list.d/docker.list > /dev/null
    - apt-get update -qq && apt-get install -y -qq docker-ce-cli docker-compose-plugin
    # Login to GHCR to pull images (CR_PAT needs read:packages scope)
    - echo "${CR_PAT}" | docker login ghcr.io -u jplipio77 --password-stdin
    # Create report dirs
    - mkdir -p reports/{contract,e2e,performance,security}
    # Create /opt/staging/.env expected by docker-compose.staging.yml backend service.
    # MONGODB_URI is already provided via environment: in the compose file.
    - mkdir -p /opt/staging
    - printf 'JWT_SECRET=%s\nNODE_ENV=production\nSESSION_SECRET=%s\n' "${JWT_SECRET}" "${JWT_SECRET}" > /opt/staging/.env
  script:
    # ── Start application via docker-compose.staging.yml ─────────────────────
    # infra/docker-compose.staging.yml reads ${BACKEND_IMAGE} and ${FRONTEND_IMAGE}
    - |
      BACKEND_IMAGE="${GHCR_IMAGE_BASE}/backend:${IMAGE_TAG}" \
      FRONTEND_IMAGE="${GHCR_IMAGE_BASE}/frontend:${IMAGE_TAG}" \
        docker compose -f infra/docker-compose.staging.yml up -d

    # ── Wait for backend health (/health endpoint, port 5000) ─────────────────
    # Health route: backend/src/routes/health.js — GET /health → {"status":"ok"}
    - |
      for i in $(seq 1 30); do
        curl -sf http://docker:5000/health && echo " backend ready" && break
        echo "Waiting for backend ($i/30)..."
        sleep 2
      done
      curl -sf http://docker:5000/health || {
        echo "Backend health check failed. Container logs:"
        docker compose -f infra/docker-compose.staging.yml logs backend
        exit 1
      }

    # ── Wait for frontend (nginx on port 80) ──────────────────────────────────
    - |
      for i in $(seq 1 15); do
        curl -sf http://docker:80 && echo " frontend ready" && break
        echo "Waiting for frontend ($i/15)..."
        sleep 2
      done


    # =========================================================================
    # Stage 1 — Contract / API Tests (Newman + Postman)
    # Collection: tests/postman/auth-flows.collection.json
    # baseUrl: http://localhost:5000/api  (matches collection default)
    # =========================================================================
    - npm install -g newman newman-reporter-htmlextra

    - |
      EXIT_CONTRACT=0

      newman run tests/postman/auth-flows.collection.json \
        --env-var baseUrl=http://docker:5000/api \
        --reporters cli,htmlextra,json \
        --reporter-htmlextra-export reports/contract/auth-api-report.html \
        --reporter-htmlextra-title 'Auth API Contract Tests' \
        --reporter-json-export reports/contract/auth-results.json \
        --color on || EXIT_CONTRACT=$?

      echo "Contract tests exit code: ${EXIT_CONTRACT}"


    # =========================================================================
    # Stage 2 — E2E Tests (Playwright)
    # Config: tests/playwright/playwright.config.js
    # APP_URL: http://localhost:80  (nginx frontend, staging compose)
    # Playwright config reads APP_URL env var; defaults to http://localhost:3000
    # =========================================================================
    - npm ci --prefix tests/playwright

    - npx --prefix tests/playwright playwright install --with-deps chromium

    - |
      EXIT_E2E=0

      cd tests/playwright
      APP_URL="http://docker:80" \
        npx playwright test --config playwright.config.js \
          2>&1 | tee ../../reports/e2e/output.log || EXIT_E2E=$?
      cd ../..

      echo "E2E tests exit code: ${EXIT_E2E}"


    # =========================================================================
    # Stage 3 — Performance Tests (k6)
    # Script: tests/k6/auth-load.js
    # STAGING_URL: http://localhost:5000  (k6 script reads STAGING_URL env var)
    # =========================================================================
    - |
      curl -s https://dl.k6.io/key.gpg | gpg --dearmor -o /usr/share/keyrings/k6-archive-keyring.gpg
      echo "deb [signed-by=/usr/share/keyrings/k6-archive-keyring.gpg] https://dl.k6.io/deb stable main" \
        | tee /etc/apt/sources.list.d/k6.list
      apt-get update -qq && apt-get install -y k6

    - |
      EXIT_PERF=0

      k6 run \
        --env STAGING_URL=http://docker:5000 \
        --summary-export=reports/performance/summary.json \
        tests/k6/auth-load.js \
        2>&1 | tee reports/performance/output.log || EXIT_PERF=$?

      echo "Performance tests exit code: ${EXIT_PERF}"


    # =========================================================================
    # Stage 4 — Security Scan (OWASP ZAP) — non-blocking
    # Target: backend API on port 5000
    # allow_failure: true mirrors fail_action: false in staging-ci.yml
    # Note: no GitHub Issue creation — findings go to artifact only
    # =========================================================================
    - |
      docker run --rm \
        --network infra_ledger-staging \
        -v "$(pwd)/reports/security:/zap/wrk:rw" \
        ghcr.io/zaproxy/zaproxy:stable \
        zap-baseline.py \
          -t "http://backend:5000" \
          -r zap-report.html \
          -J zap-report.json \
          -I \
        2>/dev/null || true   # non-blocking


    # =========================================================================
    # Generate pipeline metadata + aggregate report
    # generate-report.js reused verbatim from github-actions/poc/
    # =========================================================================
    - |
      node -e "
      const fs = require('fs');
      const stages = [
        { name: 'Contract Tests (Newman/Postman)', status: process.env.EXIT_CONTRACT === '0' ? 'PASS' : 'FAIL', durationMs: 0 },
        { name: 'E2E Tests (Playwright)',          status: process.env.EXIT_E2E      === '0' ? 'PASS' : 'FAIL', durationMs: 0 },
        { name: 'Performance Tests (k6)',          status: process.env.EXIT_PERF     === '0' ? 'PASS' : 'FAIL', durationMs: 0 },
        { name: 'Security Scan (OWASP ZAP)',       status: 'PASS', durationMs: 0 },
      ];
      const meta = {
        runAt: new Date().toISOString(),
        durationMs: 0,
        overallStatus: stages.some(s => s.status === 'FAIL') ? 'FAIL' : 'PASS',
        stages,
        triggeredBy: process.env.GITLAB_USER_NAME || 'ci',
        imageTag:    process.env.IMAGE_TAG || 'unknown',
        pipelineUrl: process.env.CI_PIPELINE_URL || '',
      };
      fs.mkdirSync('reports', { recursive: true });
      fs.writeFileSync('reports/pipeline-run.json', JSON.stringify(meta, null, 2));
      console.log('');
      console.log('=== Integration Pipeline — ' + meta.overallStatus + ' ===');
      stages.forEach(s => console.log('  [' + s.status + '] ' + s.name));
      console.log('Triggered by: ' + meta.triggeredBy);
      console.log('Image tag: ' + meta.imageTag);
      "

    # ── Propagate failures (security scan is non-blocking, others are not) ───
    - |
      FAILED=0
      [ "${EXIT_CONTRACT}" != "0" ] && FAILED=1
      [ "${EXIT_E2E}"      != "0" ] && FAILED=1
      [ "${EXIT_PERF}"     != "0" ] && FAILED=1
      [ "${FAILED}" -eq 1 ] && exit 1 || exit 0

  artifacts:
    name:     "integration-report-${CI_PIPELINE_ID}"
    paths:    [reports/]
    expire_in: 30 days
    when:     always


# =============================================================================
# STAGE 5 — STAGING BUILD (main and develop push only)
# Mirrors staging-ci.yml / build-and-package.
# Builds both images with staging-specific tags:
#   sha-<full-sha>   (immutable, used for deploy + rollback)
#   <branch-name>    (mutable, human navigation)
#   staging-latest   (main only)
# Also extracts Jira ticket ID from the HEAD commit message for downstream
# test routing — same regex as staging-ci.yml.
# =============================================================================
staging-build:
  stage: staging-build
  image: docker:24
  services:
    - docker:24-dind
  variables:
    DOCKER_TLS_CERTDIR: "/certs"
    DOCKER_BUILDKIT:    "1"
  rules:
    - if: '$CI_PIPELINE_SOURCE == "push" && ($CI_COMMIT_BRANCH == "main" || $CI_COMMIT_BRANCH == "develop")'
    - if: '$CI_PIPELINE_SOURCE == "web"'
    - if: '$CI_PIPELINE_SOURCE == "api"'
  script:
    # ── Jira ID extraction (identical regex to staging-ci.yml) ─────────────────
    - |
      COMMIT_MSG="$(git log -1 --pretty=%s)"
      echo "Commit subject: ${COMMIT_MSG}"
      JIRA_ID="$(echo "${COMMIT_MSG}" | grep -oE '[A-Z]+-[0-9]+' | head -1 || true)"
      [ -z "${JIRA_ID}" ] && JIRA_ID="FALLBACK"
      echo "Resolved Jira ID: ${JIRA_ID}"
      echo "JIRA_ID=${JIRA_ID}" >> staging.env

    # ── Login to GHCR ─────────────────────────────────────────────────────────
    - echo "${CR_PAT}" | docker login ghcr.io -u jplipio77 --password-stdin

    # ── Compute tags ──────────────────────────────────────────────────────────
    # Primary:  sha-<full-sha>  — matches GitHub Actions type=sha,format=long,prefix=sha-
    # Secondary: <branch-name>
    # Tertiary: staging-latest (main only)
    - |
      SHA_TAG="sha-${CI_COMMIT_SHA}"
      BRANCH_TAG="$(echo "${CI_COMMIT_REF_NAME}" | tr '/' '-' | tr '[:upper:]' '[:lower:]')"
      echo "STAGING_IMAGE_TAG=${SHA_TAG}"     >> staging.env
      echo "STAGING_BRANCH_TAG=${BRANCH_TAG}" >> staging.env

    # ── Build backend (prod target) with BuildKit inline cache ────────────────
    - |
      docker build \
        --target prod \
        --cache-from "${GHCR_IMAGE_BASE}/backend:${BRANCH_TAG}" \
        --cache-from "${GHCR_IMAGE_BASE}/backend:staging-latest" \
        --build-arg BUILDKIT_INLINE_CACHE=1 \
        -t "${GHCR_IMAGE_BASE}/backend:${SHA_TAG}" \
        -t "${GHCR_IMAGE_BASE}/backend:${BRANCH_TAG}" \
        ./backend

    # ── Build frontend (prod target) ──────────────────────────────────────────
    - |
      docker build \
        --target prod \
        --cache-from "${GHCR_IMAGE_BASE}/frontend:${BRANCH_TAG}" \
        --cache-from "${GHCR_IMAGE_BASE}/frontend:staging-latest" \
        --build-arg BUILDKIT_INLINE_CACHE=1 \
        -t "${GHCR_IMAGE_BASE}/frontend:${SHA_TAG}" \
        -t "${GHCR_IMAGE_BASE}/frontend:${BRANCH_TAG}" \
        ./frontend

    # ── Push all tags ─────────────────────────────────────────────────────────
    - docker push "${GHCR_IMAGE_BASE}/backend:${SHA_TAG}"
    - docker push "${GHCR_IMAGE_BASE}/backend:${BRANCH_TAG}"
    - docker push "${GHCR_IMAGE_BASE}/frontend:${SHA_TAG}"
    - docker push "${GHCR_IMAGE_BASE}/frontend:${BRANCH_TAG}"

    # staging-latest only on main
    - |
      if [ "${CI_COMMIT_BRANCH}" = "main" ]; then
        docker tag "${GHCR_IMAGE_BASE}/backend:${SHA_TAG}"  "${GHCR_IMAGE_BASE}/backend:staging-latest"
        docker tag "${GHCR_IMAGE_BASE}/frontend:${SHA_TAG}" "${GHCR_IMAGE_BASE}/frontend:staging-latest"
        docker push "${GHCR_IMAGE_BASE}/backend:staging-latest"
        docker push "${GHCR_IMAGE_BASE}/frontend:staging-latest"
      fi

  # dotenv artifact passes STAGING_IMAGE_TAG and JIRA_ID to downstream jobs
  artifacts:
    reports:
      dotenv: staging.env
    expire_in: 1 day


# =============================================================================
# STAGE 6 — STAGING DEPLOY (push to main/develop only, not on MR)
# Mirrors staging-ci.yml / staging-deploy job.
# SCPs docker-compose.staging.yml to the server (replaces the GitHub raw URL
# download in the GHA version), then SSH-runs docker compose up.
# Health check: GET /health on port 5000 — same as GHA staging-ci.yml.
#
# STAGING_SSH_KEY must be a File-type variable in GitLab (multiline key).
# =============================================================================
staging-deploy:
  stage: staging-deploy
  image: ubuntu:22.04
  environment:
    name: staging
  needs:
    - job: staging-build
      artifacts: true   # pulls STAGING_IMAGE_TAG, JIRA_ID from staging.env
  rules:
    - if: '$CI_PIPELINE_SOURCE == "push" && ($CI_COMMIT_BRANCH == "main" || $CI_COMMIT_BRANCH == "develop")'
    - if: '$CI_PIPELINE_SOURCE == "web"'
  before_script:
    - apt-get update -qq && apt-get install -y -qq openssh-client curl
    - mkdir -p ~/.ssh && chmod 700 ~/.ssh
    # STAGING_SSH_KEY must be File-type variable — GitLab writes it to a temp path
    - cp "${STAGING_SSH_KEY}" ~/.ssh/id_deploy && chmod 600 ~/.ssh/id_deploy
    - ssh-keyscan -H "${STAGING_HOST}" >> ~/.ssh/known_hosts 2>/dev/null
  script:
    # ── SCP docker-compose.staging.yml to server ──────────────────────────────
    # Replaces the GitHub raw content download in staging-ci.yml:
    #   curl -fsSL https://raw.githubusercontent.com/.../docker-compose.staging.yml
    # The file is already in the workspace from checkout — SCP it directly.
    - |
      scp -i ~/.ssh/id_deploy \
          -o StrictHostKeyChecking=yes \
          infra/docker-compose.staging.yml \
          "${STAGING_USER}@${STAGING_HOST}:/opt/staging/docker-compose.staging.yml"

    # ── SSH deploy ────────────────────────────────────────────────────────────
    # Script is functionally identical to staging-ci.yml deploy step.
    - |
      BACKEND_IMG="${GHCR_IMAGE_BASE}/backend:${STAGING_IMAGE_TAG}"
      FRONTEND_IMG="${GHCR_IMAGE_BASE}/frontend:${STAGING_IMAGE_TAG}"

      ssh -i ~/.ssh/id_deploy \
          -o StrictHostKeyChecking=yes \
          "${STAGING_USER}@${STAGING_HOST}" \
          BACKEND_IMAGE="${BACKEND_IMG}" \
          FRONTEND_IMAGE="${FRONTEND_IMG}" \
          GHCR_TOKEN="${GHCR_READ_TOKEN}" \
          GHCR_USER="jplipio77" \
          bash -s << 'REMOTE'

        set -euo pipefail
        cd /opt/staging

        docker compose -f docker-compose.staging.yml down --remove-orphans 2>/dev/null || true
        docker rm -f staging-mongo-1 staging-backend-1 staging-frontend-1 2>/dev/null || true
        docker system prune -af 2>&1 | tail -2

        echo "${GHCR_TOKEN}" | docker login ghcr.io -u "${GHCR_USER}" --password-stdin 2>&1 | tail -1

        docker pull --quiet "${BACKEND_IMAGE}"
        docker pull --quiet "${FRONTEND_IMAGE}"

        export BACKEND_IMAGE FRONTEND_IMAGE
        docker compose -f docker-compose.staging.yml up -d 2>&1 | tail -5

        echo "Waiting 40s for services to initialise..."
        sleep 40

        curl --fail --silent --show-error --max-time 15 http://localhost:5000/health \
          || { docker compose -f docker-compose.staging.yml logs --tail 60; exit 1; }

        echo "Deploy healthy: ${BACKEND_IMAGE}"
      REMOTE


# =============================================================================
# STAGE 7a — STAGING TESTS (parallel with staging-security)
# Mirrors staging-ci.yml / staging-tests job.
# Runs Newman, Playwright, k6 against the live staging URL.
#
# Variable mapping vs GitHub Actions:
#   vars.STAGING_URL  →  $STAGING_URL CI variable (set in staging environment)
#   baseUrl           →  ${STAGING_URL}/api  (Newman, same pattern as GHA)
#   APP_URL / STAGING_URL → Playwright config reads STAGING_URL  (same as GHA)
#   STAGING_URL       → k6 script reads STAGING_URL  (same as GHA)
# =============================================================================
staging-tests:
  stage: staging-test
  image: node:20
  needs:
    - job: staging-build
      artifacts: true   # pulls JIRA_ID (for future manifest routing)
    - job: staging-deploy
      artifacts: false  # ordering only
  rules:
    - if: '$CI_PIPELINE_SOURCE == "push" && ($CI_COMMIT_BRANCH == "main" || $CI_COMMIT_BRANCH == "develop")'
    - if: '$CI_PIPELINE_SOURCE == "web"'
  before_script:
    - apt-get update -qq && apt-get install -y -qq curl
    - npm install -g newman newman-reporter-htmlextra
    # Install Playwright
    - npm install --save-dev @playwright/test
    - npx playwright install --with-deps chromium
    # Install k6
    - |
      curl -s https://dl.k6.io/key.gpg | gpg --dearmor -o /usr/share/keyrings/k6-archive-keyring.gpg
      echo "deb [signed-by=/usr/share/keyrings/k6-archive-keyring.gpg] https://dl.k6.io/deb stable main" \
        | tee /etc/apt/sources.list.d/k6.list
      apt-get update -qq && apt-get install -y k6
      k6 version
  script:
    - mkdir -p tests/reports/{newman,playwright,k6}

    # ── Newman — Auth Flows API Tests ─────────────────────────────────────────
    # Identical to staging-ci.yml: baseUrl=${STAGING_URL}/api, --bail on first failure
    - |
      newman run tests/postman/auth-flows.collection.json \
        --env-var "baseUrl=${STAGING_URL}/api" \
        --reporters cli,htmlextra \
        --reporter-htmlextra-export tests/reports/newman/auth-flows.html \
        --bail

    # ── Playwright — Auth E2E ─────────────────────────────────────────────────
    # Identical to staging-ci.yml: STAGING_URL env var passed to playwright config
    - |
      STAGING_URL="${STAGING_URL}" \
        npx playwright test tests/playwright/auth.spec.js \
          --config tests/playwright/playwright.config.js

    # ── k6 — Auth Load Test ───────────────────────────────────────────────────
    # Identical to staging-ci.yml: STAGING_URL env var passed to k6 script
    - |
      k6 run \
        -e STAGING_URL="${STAGING_URL}" \
        --summary-export tests/reports/k6/summary.json \
        tests/k6/auth-load.js

  artifacts:
    name:      "staging-tests-${CI_COMMIT_SHORT_SHA}"
    paths:
      - tests/reports/newman/
      - tests/reports/playwright/
      - tests/reports/k6/
    expire_in: 30 days
    when:      always


# =============================================================================
# STAGE 7b — STAGING SECURITY SCAN (parallel with staging-tests)
# Mirrors staging-ci.yml / security-scan job.
# OWASP ZAP baseline DAST against the live staging URL.
# allow_failure: true mirrors fail_action: false in the GHA version.
# NOTE: GitHub Actions writes findings to a GitHub Issue (allow_issue_writing:true).
#       GitLab has no equivalent — findings are uploaded as an artifact instead.
# =============================================================================
staging-security:
  stage: staging-test
  image: docker:24
  services:
    - docker:24-dind
  variables:
    DOCKER_TLS_CERTDIR: "/certs"
  needs:
    - job: staging-deploy
      artifacts: false
  rules:
    - if: '$CI_PIPELINE_SOURCE == "push" && ($CI_COMMIT_BRANCH == "main" || $CI_COMMIT_BRANCH == "develop")'
    - if: '$CI_PIPELINE_SOURCE == "web"'
  allow_failure: true   # non-blocking — mirrors fail_action: false
  script:
    - mkdir -p zap-reports
    - |
      docker run --rm \
        -v "$(pwd)/zap-reports:/zap/wrk:rw" \
        ghcr.io/zaproxy/zaproxy:stable \
        zap-baseline.py \
          -t "${STAGING_URL}" \
          -r zap-report.html \
          -J zap-report.json \
          -I -j \
        || true   # non-blocking
  artifacts:
    name:      "zap-baseline-${CI_COMMIT_SHORT_SHA}"
    paths:     [zap-reports/]
    expire_in: 30 days
    when:      always
