name: CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: [master]

jobs:
  backend-test:
    name: Backend — Lint & Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Run tests with coverage
        run: npm run test:coverage
        env:
          NODE_ENV: test
          MONGOMS_VERSION: '7.0.14'
          MONGOMS_DOWNLOAD_TIMEOUT: '120000'

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          directory: backend/coverage
          flags: backend
          fail_ci_if_error: false

  frontend-test:
    name: Frontend — Lint & Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Run tests with coverage
        run: npm run test:coverage

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          directory: frontend/coverage
          flags: frontend
          fail_ci_if_error: false

  docker-build-check:
    name: Docker Build Check
    runs-on: ubuntu-latest
    needs: [backend-test, frontend-test]

    steps:
      - uses: actions/checkout@v4

      - name: Create backend .env
        run: |
          cp backend/.env.example backend/.env
          echo "SESSION_SECRET=$(openssl rand -hex 32)" >> backend/.env
          echo "MONGODB_URI=mongodb://mongo:27017/finance_ledger" >> backend/.env

      - name: Create frontend .env
        run: |
          cp frontend/.env.example frontend/.env
          echo "VITE_API_BASE_URL=http://localhost:5000/api" >> frontend/.env

      - name: Build Docker images (dev targets)
        run: docker compose build
