# =============================================================================
# staging-ci.yml — Staging CI/CD for PersonalFinanceLedgerApp
#
# Execution order:
#   build-and-package → staging-deploy → staging-tests
#                                      ↘ security-scan (parallel)
#
# Required secrets:
#   AWS_ACCESS_KEY_ID     — IAM user key; needs ssm:SendCommand on the staging instance
#   AWS_SECRET_ACCESS_KEY — IAM user secret
#   STAGING_INSTANCE_ID   — EC2 instance ID (e.g. i-0b6fa116f71505b14)
#   QA_REPO_TOKEN         — Fine-grained PAT with Contents:read on qa-automation-manifest
#
# Server-side (stored once in /opt/staging/.env on the EC2 instance):
#   GHCR_TOKEN            — Classic PAT with read:packages scope
#   GHCR_USER             — GitHub username for docker login (e.g. JPlipio77)
#
# Required repository variables:
#   STAGING_URL       — Full base URL of the staging deployment, e.g. http://your.server.ip:5000
# =============================================================================

name: Staging CI/CD

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

env:
  REGISTRY:   ghcr.io
  IMAGE_NAME: ${{ github.repository }}


# =============================================================================
# Job 1 — Build & Package
# Builds backend and frontend Docker images, pushes to GHCR with staging tags,
# and extracts a Jira ticket ID from the HEAD commit message for test routing.
# =============================================================================
jobs:
  build-and-package:
    name: Build & Push to GHCR
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    outputs:
      image-tag:  ${{ steps.sha.outputs.tag }}
      image-repo: ${{ steps.sha.outputs.repo }}
      jira-id:    ${{ steps.extract-jira.outputs.jira_id }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Extract Jira ticket ID from commit message
        id: extract-jira
        run: |
          COMMIT_MSG="$(git log -1 --pretty=%s)"
          JIRA_ID="$(echo "${COMMIT_MSG}" | grep -oP '[A-Z]+-\d+' | head -1 || true)"
          if [ -z "${JIRA_ID}" ]; then
            JIRA_ID="FALLBACK"
          fi
          echo "jira_id=${JIRA_ID}" >> "${GITHUB_OUTPUT}"
          echo "Resolved Jira ID: ${JIRA_ID}"

      - name: Set short SHA tag and lowercase repo
        id: sha
        run: |
          echo "tag=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT
          echo "repo=${GITHUB_REPOSITORY,,}" >> $GITHUB_OUTPUT

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push backend image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          target: prod
          push: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: |
            ghcr.io/${{ steps.sha.outputs.repo }}/backend:staging-${{ steps.sha.outputs.tag }}
            ghcr.io/${{ steps.sha.outputs.repo }}/backend:staging-latest

      - name: Build and push frontend image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          target: prod
          push: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: |
            ghcr.io/${{ steps.sha.outputs.repo }}/frontend:staging-${{ steps.sha.outputs.tag }}
            ghcr.io/${{ steps.sha.outputs.repo }}/frontend:staging-latest


# =============================================================================
# Job 2 — Deploy to Staging
# Uses AWS SSM Run Command to deploy on the staging server — no SSH keys needed.
# The staging EC2 instance must have:
#   - Docker + Docker Compose installed
#   - IAM instance profile with AmazonSSMManagedInstanceCore
#   - /opt/staging/.env with MONGODB_URI, JWT_SECRET, NODE_ENV=staging, PORT=5000,
#     GHCR_TOKEN=<read PAT>, GHCR_USER=<GitHub username>
#   - /opt/staging/docker-compose.staging.yml referencing BACKEND_IMAGE/FRONTEND_IMAGE
# =============================================================================
  staging-deploy:
    name: Deploy to Staging
    needs: build-and-package
    runs-on: ubuntu-latest
    environment: staging

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region:            ap-southeast-1

      - name: Deploy via SSM Run Command (no SSH key required)
        env:
          INSTANCE_ID:  ${{ secrets.STAGING_INSTANCE_ID }}
          IMAGE_REPO:   ${{ needs.build-and-package.outputs.image-repo }}
          IMAGE_TAG:    ${{ needs.build-and-package.outputs.image-tag }}
          GHCR_TOKEN:   ${{ secrets.GHCR_READ_TOKEN }}
          GHCR_USER:    ${{ github.actor }}
        run: |
          BACKEND_IMAGE="ghcr.io/${IMAGE_REPO}/backend:staging-${IMAGE_TAG}"
          FRONTEND_IMAGE="ghcr.io/${IMAGE_REPO}/frontend:staging-${IMAGE_TAG}"

          # Build SSM parameter JSON with jq — handles all escaping safely
          PARAMS=$(jq -cn \
            --arg b "$BACKEND_IMAGE" \
            --arg f "$FRONTEND_IMAGE" \
            --arg t "$GHCR_TOKEN" \
            --arg u "$GHCR_USER" \
            '{commands: [
              "#!/bin/bash",
              "set -euo pipefail",
              ("echo " + $t + " | docker login ghcr.io -u " + $u + " --password-stdin"),
              ("docker pull " + $b),
              ("docker pull " + $f),
              "cd /opt/staging",
              ("export BACKEND_IMAGE=" + $b),
              ("export FRONTEND_IMAGE=" + $f),
              "docker compose -f docker-compose.staging.yml down --remove-orphans",
              "docker compose -f docker-compose.staging.yml up -d --force-recreate",
              "sleep 25",
              "curl --fail --silent --show-error http://localhost:5000/health || { docker compose -f docker-compose.staging.yml logs --tail 60; exit 1; }",
              ("echo \"Deploy healthy: " + $b + "\"")
            ]}')

          CMD_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --comment "staging-${IMAGE_TAG}" \
            --parameters "$PARAMS" \
            --output text --query 'Command.CommandId')

          echo "SSM Command ID: $CMD_ID"

          # Poll until complete (max 5 min / 30 × 10s)
          for i in $(seq 1 30); do
            STATUS=$(aws ssm get-command-invocation \
              --command-id "$CMD_ID" \
              --instance-id "$INSTANCE_ID" \
              --query 'Status' --output text 2>/dev/null || echo "InProgress")
            echo "[$i/30] $STATUS"
            if [ "$STATUS" = "Success" ]; then
              aws ssm get-command-invocation \
                --command-id "$CMD_ID" \
                --instance-id "$INSTANCE_ID" \
                --query 'StandardOutputContent' --output text
              exit 0
            fi
            if [[ "$STATUS" =~ ^(Failed|Cancelled|TimedOut)$ ]]; then
              aws ssm get-command-invocation \
                --command-id "$CMD_ID" \
                --instance-id "$INSTANCE_ID" \
                --query '[StandardOutputContent,StandardErrorContent]' \
                --output text
              exit 1
            fi
            sleep 10
          done
          echo "Timed out after 5 minutes"
          exit 1


# =============================================================================
# Job 3 — Staging Tests (Dynamic Discovery)
# Resolves the test manifest for the triggering Jira ticket and runs
# targeted Newman + Playwright tests against the live staging environment.
# =============================================================================
  staging-tests:
    name: Staging Test Suite
    needs: [build-and-package, staging-deploy]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout QA mono-repo
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/qa-automation-manifest
          token:      ${{ secrets.QA_REPO_TOKEN }}
          path:       qa-automation-manifest
          fetch-depth: 1

      - name: Resolve feature manifest or regression fallback
        id: resolve
        env:
          JIRA_ID:      ${{ needs.build-and-package.outputs.jira-id }}
          PROJECT_NAME: ${{ github.event.repository.name }}
        run: |
          # Paths relative to qa-automation-manifest/ (the script's working-directory)
          MANIFEST="${PROJECT_NAME}/manifests/${JIRA_ID}.json"
          FALLBACK="${PROJECT_NAME}/manifests/regression-default.json"

          if [ "${JIRA_ID}" != "FALLBACK" ] && [ -f "qa-automation-manifest/${MANIFEST}" ]; then
            echo "manifest_path=${MANIFEST}" >> "${GITHUB_OUTPUT}"
            echo "test_mode=feature"         >> "${GITHUB_OUTPUT}"
          elif [ -f "qa-automation-manifest/${FALLBACK}" ]; then
            echo "manifest_path=${FALLBACK}" >> "${GITHUB_OUTPUT}"
            echo "test_mode=regression"      >> "${GITHUB_OUTPUT}"
          else
            echo "ERROR: No manifest found for '${PROJECT_NAME}'." >&2
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: qa-automation-manifest/package-lock.json

      - name: Install Newman and Playwright
        working-directory: qa-automation-manifest
        run: npm ci

      - name: Install Playwright browser (Chromium)
        working-directory: qa-automation-manifest
        run: npx playwright install --with-deps chromium

      - name: Run targeted test suite
        working-directory: qa-automation-manifest
        env:
          STAGING_URL:   ${{ vars.STAGING_URL }}
          MANIFEST_PATH: ${{ steps.resolve.outputs.manifest_path }}
          TEST_MODE:     ${{ steps.resolve.outputs.test_mode }}
          PROJECT_NAME:  ${{ github.event.repository.name }}
        run: bash scripts/run-qa-tests.sh

      - name: Upload Newman HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: newman-report-${{ github.sha }}
          path: qa-automation-manifest/reports/newman/
          if-no-files-found: warn

      - name: Upload Playwright HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ github.sha }}
          path: qa-automation-manifest/reports/playwright/
          if-no-files-found: warn


# =============================================================================
# Job 4 — OWASP ZAP DAST Baseline (parallel with staging-tests)
# Passive security sweep against the live staging URL.
# fail_action: false keeps the pipeline green while logging findings to an Issue.
# =============================================================================
  security-scan:
    name: OWASP ZAP Baseline DAST
    needs: staging-deploy
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues:   write

    steps:
      - name: ZAP Baseline Scan against staging
        uses: zaproxy/action-baseline@v0.14.0
        with:
          target:              ${{ vars.STAGING_URL }}
          fail_action:         false
          allow_issue_writing: true
          artifact_name:       zap-baseline-${{ github.run_id }}
          cmd_options:         '-I -j'
