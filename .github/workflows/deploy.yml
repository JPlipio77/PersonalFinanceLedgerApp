name: Deploy

on:
  push:
    branches: [main, master]

jobs:
  # ── Job 1: build full production images and push to GHCR ──────────────────
  build-push:
    name: Build & Push Docker Images
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      tag:  ${{ steps.sha.outputs.tag }}
      repo: ${{ steps.sha.outputs.repo }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set short SHA tag and lowercase repo
        id: sha
        run: |
          echo "tag=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT
          echo "repo=${GITHUB_REPOSITORY,,}" >> $GITHUB_OUTPUT

      - name: Build and push backend image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          target: prod
          push: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: |
            ghcr.io/${{ steps.sha.outputs.repo }}/backend:${{ steps.sha.outputs.tag }}
            ghcr.io/${{ steps.sha.outputs.repo }}/backend:latest

      - name: Build and push frontend image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          target: prod
          push: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: |
            ghcr.io/${{ steps.sha.outputs.repo }}/frontend:${{ steps.sha.outputs.tag }}
            ghcr.io/${{ steps.sha.outputs.repo }}/frontend:latest

  # ── Job 2: dispatch to test repo after images are confirmed pushed ──────────
  dispatch-tests:
    name: Trigger Test Pipeline
    needs: [build-push]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Dispatch to ledger-app-tests
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.TESTS_REPO_TOKEN }}
          script: |
            await github.rest.repos.createDispatchEvent({
              owner: context.repo.owner,
              repo: 'ledger-app-tests',
              event_type: 'app-deployed',
              client_payload: {
                sha: context.sha,
                image_tag: '${{ needs.build-push.outputs.tag }}',
                image_base: `ghcr.io/${context.repo.owner.toLowerCase()}/${context.repo.repo.toLowerCase()}`,
                triggered_by: context.actor,
                source_run_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              }
            });
            core.info('Test pipeline dispatched for image tag: ${{ needs.build-push.outputs.tag }}');
