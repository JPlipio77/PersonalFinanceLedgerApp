name: Deploy

on:
  push:
    branches: [main, master]

jobs:
  # ── Job 1: build full production images and push to GHCR ──────────────────
  build-push:
    name: Build & Push Docker Images
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      tag:  ${{ steps.sha.outputs.tag }}
      repo: ${{ steps.sha.outputs.repo }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set short SHA tag and lowercase repo
        id: sha
        run: |
          echo "tag=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT
          echo "repo=${GITHUB_REPOSITORY,,}" >> $GITHUB_OUTPUT

      - name: Build and push backend image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          target: prod
          push: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: |
            ghcr.io/${{ steps.sha.outputs.repo }}/backend:${{ steps.sha.outputs.tag }}
            ghcr.io/${{ steps.sha.outputs.repo }}/backend:latest

      - name: Build and push frontend image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          target: prod
          push: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: |
            ghcr.io/${{ steps.sha.outputs.repo }}/frontend:${{ steps.sha.outputs.tag }}
            ghcr.io/${{ steps.sha.outputs.repo }}/frontend:latest

  # ── Job 2: slim the pushed images and push slim variants ───────────────────
  slim-images:
    name: Slim Docker Images
    runs-on: ubuntu-latest
    needs: build-push
    continue-on-error: true
    permissions:
      contents: read
      packages: write
    env:
      TAG:           ${{ needs.build-push.outputs.tag }}
      REPO:          ${{ needs.build-push.outputs.repo }}
      BACKEND_FULL:  ghcr.io/${{ needs.build-push.outputs.repo }}/backend:latest
      FRONTEND_FULL: ghcr.io/${{ needs.build-push.outputs.repo }}/frontend:latest
      BACKEND_SLIM:  ghcr.io/${{ needs.build-push.outputs.repo }}/backend:slim
      FRONTEND_SLIM: ghcr.io/${{ needs.build-push.outputs.repo }}/frontend:slim

    steps:
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Install SlimToolkit
        run: |
          curl -sL https://raw.githubusercontent.com/slimtoolkit/slim/master/scripts/install-slim.sh | sudo -E bash -
          slim version

      - name: Pull full images
        run: |
          docker pull "$BACKEND_FULL"
          docker pull "$FRONTEND_FULL"

      - name: Record full image sizes
        id: full-sizes
        run: |
          be=$(docker inspect "$BACKEND_FULL"  --format='{{.Size}}' | awk '{printf "%.1f MB", $1/1024/1024}')
          fe=$(docker inspect "$FRONTEND_FULL" --format='{{.Size}}' | awk '{printf "%.1f MB", $1/1024/1024}')
          echo "backend=$be"   >> $GITHUB_OUTPUT
          echo "frontend=$fe"  >> $GITHUB_OUTPUT
          echo "Backend full: $be  |  Frontend full: $fe"

      # Backend: skip HTTP probe (requires MongoDB at startup).
      # Preserve /app and the node binary; slim removes unused OS packages.
      - name: Slim backend image
        run: |
          slim build \
            --include-path /app \
            --include-bin  /usr/local/bin/node \
            --http-probe=false \
            --continue-after exec \
            --exec "node -e 'process.exit(0)'" \
            --exec-wait 5 \
            --tag "$BACKEND_SLIM" \
            --tag "ghcr.io/${{ steps.sha.outputs.repo }}/backend:${{ env.TAG }}-slim" \
            "$BACKEND_FULL"

      # Frontend: nginx + static files — HTTP probe exercises all paths.
      - name: Slim frontend image
        run: |
          slim build \
            --http-probe \
            --http-probe-cmd "GET /" \
            --expose 80 \
            --tag "$FRONTEND_SLIM" \
            --tag "ghcr.io/${{ steps.sha.outputs.repo }}/frontend:${{ env.TAG }}-slim" \
            "$FRONTEND_FULL"

      - name: Push slim images
        run: |
          docker push "$BACKEND_SLIM"
          docker push "ghcr.io/${{ steps.sha.outputs.repo }}/backend:${{ env.TAG }}-slim"
          docker push "$FRONTEND_SLIM"
          docker push "ghcr.io/${{ steps.sha.outputs.repo }}/frontend:${{ env.TAG }}-slim"

      - name: Record slim image sizes
        id: slim-sizes
        run: |
          be=$(docker inspect "$BACKEND_SLIM"  --format='{{.Size}}' | awk '{printf "%.1f MB", $1/1024/1024}')
          fe=$(docker inspect "$FRONTEND_SLIM" --format='{{.Size}}' | awk '{printf "%.1f MB", $1/1024/1024}')
          echo "backend=$be"   >> $GITHUB_OUTPUT
          echo "frontend=$fe"  >> $GITHUB_OUTPUT

      - name: Write job summary
        run: |
          cat >> $GITHUB_STEP_SUMMARY <<EOF
          ### 🐳 Docker Image Deploy — \`${{ env.TAG }}\`

          | Image | Full size | Slim size | Tags |
          |---|---|---|---|
          | Backend  | ${{ steps.full-sizes.outputs.backend }}  | ${{ steps.slim-sizes.outputs.backend }}  | \`latest\`, \`${{ env.TAG }}\`, \`slim\`, \`${{ env.TAG }}-slim\` |
          | Frontend | ${{ steps.full-sizes.outputs.frontend }} | ${{ steps.slim-sizes.outputs.frontend }} | \`latest\`, \`${{ env.TAG }}\`, \`slim\`, \`${{ env.TAG }}-slim\` |

          #### Registry
          \`\`\`
          ghcr.io/${{ steps.sha.outputs.repo }}/backend:slim
          ghcr.io/${{ steps.sha.outputs.repo }}/frontend:slim
          \`\`\`
          EOF

      - name: Trigger staging deploy (optional)
        if: ${{ env.DEPLOY_HOOK_URL != '' }}
        env:
          DEPLOY_HOOK_URL: ${{ secrets.DEPLOY_HOOK_URL }}
        run: |
          curl -X POST "$DEPLOY_HOOK_URL" \
            -H "Content-Type: application/json" \
            -d "{\"tag\":\"${{ env.TAG }}-slim\"}"

  # ── Job 3: dispatch to test repo after images are confirmed pushed ──────────
  dispatch-tests:
    name: Trigger Test Pipeline
    needs: [build-push]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Dispatch to ledger-app-tests
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.TESTS_REPO_TOKEN }}
          script: |
            await github.rest.repos.createDispatchEvent({
              owner: context.repo.owner,
              repo: 'ledger-app-tests',
              event_type: 'app-deployed',
              client_payload: {
                sha: context.sha,
                image_tag: '${{ needs.build-push.outputs.tag }}',
                image_base: `ghcr.io/${context.repo.owner.toLowerCase()}/${context.repo.repo.toLowerCase()}`,
                triggered_by: context.actor,
                source_run_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              }
            });
            core.info('Test pipeline dispatched for image tag: ${{ needs.build-push.outputs.tag }}');
